name: Update README stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dark&hide_rank=true&count_private=true&icon_color=blue
          path: profile/images/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top langs card
        uses: readme-tools/github-readme-stats-action@м1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=dark&count_private=true
          path: profile/images/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/images/*.svg
          git commit -m "Update README cards" || exit 0
          git push